<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Soal Informatika</title>
    <style>
        /* --- RESET & BASE STYLES --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* --- CONTAINER UTAMA --- */
        .container {
            width: 100%;
            max-width: 900px;
            text-align: center;
        }

        /* --- HEADER / JUDUL UTAMA --- */
        .main-title {
            font-size: 3rem;
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 40px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* --- GRID PILIHAN SOAL --- */
        .quiz-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            padding: 10px;
        }

        /* --- CARD / TOMBOL SOAL --- */
        .quiz-card {
            background-color: #ffffff;
            padding: 30px 20px;
            border-radius: 12px;
            text-decoration: none;
            color: #2c3e50;
            font-weight: 600;
            font-size: 1.2rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
            border: 2px solid transparent;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- EFEK HOVER (KETIKA KURSOR DI ATAS CARD) --- */
        .quiz-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
            border-color: #3498db;
            color: #3498db;
        }

        /* --- RESPONSIVE UNTUK LAYAR KECIL --- */
        @media (max-width: 600px) {
            .main-title {
                font-size: 2.2rem;
                margin-bottom: 30px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Tulisan Informatika di Tengah -->
        <h1 class="main-title">Soal OSN</h1>

        <!-- Pilihan Soal -->
        <div class="quiz-grid">

            <a href="OSNK2022.pdf" class="quiz-card">OSNK2022</a>
            <a href="OSNK2023.pdf" class="quiz-card">OSNK2023</a>
            <a href="OSNK2024.pdf" class="quiz-card">OSNK2024</a>
            <a href="OSNK2025.pdf" class="quiz-card">OSNK2025</a>
            <a href="OSNK2026.pdf" class="quiz-card">OSNK2026</a>
            <a href="OSNP2022.pdf" class="quiz-card">OSNP2022</a>
            <a href="OSNP2023.pdf" class="quiz-card">OSNP2023</a>
            <a href="OSNP2024.pdf" class="quiz-card">OSNP2024</a>
            <a href="OSNP2025.pdf" class="quiz-card">OSNP2025</a>
            <a href="OSNP2026.pdf" class="quiz-card">OSNP2026</a>
            <a href="Pembahasan Singkat OSN 2022 Bidang Informatika.pdf" class="quiz-card">OSN2022</a>
            <a href="OSN2023.pdf" class="quiz-card">OSN2023</a>
            <a href="OSN2024.pdf" class="quiz-card">OSN2024</a>
            <a href="OSN2025Semifinal.pdf" class="quiz-card">Semi Final 2025</a>
            <a href="OSN2025.pdf" class="quiz-card">OSN2025</a>

        </div>
